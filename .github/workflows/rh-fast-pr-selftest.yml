name: RH Fast PR Selftest

on:
  push:
    paths:
      - ".github/workflows/rh-fast-pr-selftest.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and close synthetic RH-FAST PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="rh-fast/selftest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "rh-fast-sensor[bot]"
          git config user.email "rh-fast-sensor[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p events
          printf '{"schema":"rh-fast-event/1","trigger":"SELFTEST","run_id":"%s","attempt":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "events/selftest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          git add "events/selftest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          git commit -m "RH-FAST PR event selftest"
          git push origin "$BRANCH"
          URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "[RH-FAST][SELFTEST] PR webhook source" --body "Synthetic one-time PR used only to verify that the 5-minute Fast Sensor can emit GitHub pull-request events.")
          echo "SELFTEST_PR=$URL"
          gh pr close "$URL" --repo "$GITHUB_REPOSITORY" --delete-branch
