name: RH Fast Copilot Selftest

on:
  push:
    paths:
      - ".github/workflows/rh-fast-copilot-selftest.yml"

permissions:
  contents: read
  copilot-requests: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run one minimal Copilot request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --yolo -p "Reply with exactly: RH_FAST_COPILOT_OK"
